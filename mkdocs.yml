site_name: Teamstudio Export 5.1

nav:
  - 'index.md'
  - 'Teamstudio Export':
    - 'installing.md'
    - 'configuration.md'
    - 'overview.md'
    - 'archiving.md'
    - 'HTML' :
      - 'html.md'
      - 'htmlviewfield.md'
      - 'keyboard.md'
    - 'pdf.md'
    - 'Exporting Data' :
      - 'data.md'
      - 'spsites.md'
    - 'progress.md'
  - 'archive.md'
  - 'release.md'

theme:
  name: material

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja
      
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  
plugins:
  - search
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Exporting Data: データのエクスポート
